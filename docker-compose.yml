version: '3.8'

services:
  myhome:
    build: .
    container_name: myhome
    ports:
      - "7000:8080"
    restart: unless-stopped
    environment:
      - DB_HOST=124.54.134.127
      - DB_PORT=13306
      - DB_USER=root
      - DB_PASS=1q2w3e4r5t^Y
      - DB_NAME=myhome
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - myhome-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - myhome-net

networks:
  myhome-net:
    driver: bridge

volumes:
  ollama_data:
