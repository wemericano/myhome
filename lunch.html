<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>식당 리스트 - My Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #8b5cf6;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s ease;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .back-btn:hover {
      transform: translateX(-4px);
      background: rgba(139, 92, 246, 0.2);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
    }
    .spinner {
      border: 4px solid rgba(236, 72, 153, 0.3);
      border-top: 4px solid #ec4899;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid #dc2626;
      color: #fca5a5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    .food-list {
      display: grid;
      gap: 20px;
    }
    .food-card {
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.1) 0%, rgba(109, 40, 217, 0.1) 100%);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
    }
    .food-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.5);
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.15) 0%, rgba(109, 40, 217, 0.15) 100%);
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.2);
    }
    .food-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .food-name {
      font-size: 20px;
      font-weight: bold;
      color: #60a5fa;
    }
    .food-star {
      font-size: 24px;
      font-weight: bold;
      color: #fbbf24;
    }
    .food-kind {
      display: inline-block;
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      margin-right: 8px;
    }
    .food-details {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.8;
    }
    .food-detail-item {
      margin-bottom: 8px;
    }
    .food-price {
      color: #4ade80;
      font-weight: 600;
      font-size: 15px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍽️ 식당 리스트</h1>
      <button class="back-btn" onclick="goHome()">← 돌아가기</button>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    async function loadFoods() {
      const contentDiv = document.getElementById('content');

      try {
        const response = await fetch('/api/food');
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          let html = '<div class="food-list">';
          result.data.forEach(food => {
            html += `
              <div class="food-card">
                <div class="food-header">
                  <div class="food-name">${food.name}</div>
                  ${food.star ? `<div class="food-star">${food.star} ⭐</div>` : ''}
                </div>
                ${food.kind ? `<div class="food-kind">${food.kind}</div>` : ''}
                <div class="food-details">
                  ${food.location ? `<div class="food-detail-item">📍 ${food.location}</div>` : ''}
                  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    ${food.distance ? `<span>🚶 거리: ${food.distance}m</span>` : ''}
                    ${food.feet ? `<span>🚶 거리: ${food.feet}ft</span>` : ''}
                    ${food.time ? `<span>⏱️ 시간: ${food.time}분</span>` : ''}
                  </div>
                  ${food.price ? `<div class="food-price">💰 ${food.price}</div>` : ''}
                </div>
              </div>
            `;
          });
          html += '</div>';
          contentDiv.innerHTML = html;
        } else if (result.success) {
          contentDiv.innerHTML = '<div class="empty"><p>식당 데이터가 없습니다.</p></div>';
        } else {
          contentDiv.innerHTML = `<div class="error">${result.error || '데이터를 불러올 수 없습니다.'}</div>`;
        }
      } catch (error) {
        contentDiv.innerHTML = '<div class="error">네트워크 오류가 발생했습니다.</div>';
      }
    }

    function goHome() {
      window.location.href = '/';
    }

    // 페이지 로드 시 식당 데이터 불러오기
    loadFoods();
  </script>
</body>
</html>
