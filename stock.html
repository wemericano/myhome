<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>기관 매집 현황</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #8b5cf6;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      transform: translateX(-4px);
    }
    .search-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 36px;
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 13px; color: #94a3b8; }
    .field input, .field select {
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 15px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: rgba(139, 92, 246, 0.7);
    }
    .btn-search {
      padding: 10px 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      height: 42px;
    }
    .btn-search:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-search:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .table-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-card.top { border-color: rgba(59, 130, 246, 0.3); }
    .table-card.bottom { border-color: rgba(239, 68, 68, 0.3); }
    .table-header {
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .table-card.top .table-header { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .table-card.bottom .table-header { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 10px 16px;
      font-size: 12px;
      color: #64748b;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .rank { color: #64748b; font-size: 13px; width: 30px; }
    .code { color: #94a3b8; font-size: 12px; }
    .name { font-weight: 600; }
    .amount-up { color: #3b82f6; font-weight: 700; text-align: right; }
    .amount-down { color: #ef4444; font-weight: 700; text-align: right; }
    .loading {
      text-align: center;
      padding: 60px;
      color: #64748b;
      font-size: 16px;
    }
    .error-msg {
      text-align: center;
      padding: 60px;
      color: #ef4444;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 기관 매집 현황</h1>
      <a href="index.html" class="back-btn">← 돌아가기</a>
    </div>

    <div class="search-box">
      <div class="field">
        <label>날짜</label>
        <input type="text" id="date" placeholder="날짜 선택" readonly style="cursor:pointer; width:140px;" />
      </div>
      <div class="field">
        <label>시장</label>
        <select id="market">
          <option value="STK">KOSPI</option>
          <option value="KSQ">KOSDAQ</option>
        </select>
      </div>
      <button class="btn-search" onclick="search()">조회</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
  <script>
    function getDefaultDate() {
      const d = new Date();
      const day = d.getDay();
      if (day === 0) d.setDate(d.getDate() - 2);
      else if (day === 6) d.setDate(d.getDate() - 1);
      return d;
    }

    const fp = flatpickr("#date", {
      locale: "ko",
      dateFormat: "Y-m-d",
      defaultDate: getDefaultDate(),
      disableMobile: true,
    });

    async function search() {
      const date = document.getElementById('date').value.replace(/-/g, '');
      const market = document.getElementById('market').value;
      const btn = document.querySelector('.btn-search');
      const result = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = '조회 중...';
      result.innerHTML = '<div class="loading">⏳ 데이터 불러오는 중...</div>';

      try {
        const res = await fetch(`/api/institutional?date=${date}&market=${market}`);
        const data = await res.json();

        if (!res.ok) {
          result.innerHTML = `<div class="error-msg">❌ ${data.error || '데이터 없음'}</div>`;
          return;
        }

        result.innerHTML = `
          <div class="grid">
            ${renderTable('top', '📈 기관 순매수 상위 10', data.top)}
            ${renderTable('bottom', '📉 기관 순매도 상위 10', data.bottom)}
          </div>
        `;
      } catch (e) {
        result.innerHTML = '<div class="error-msg">❌ 서버 연결 실패</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '조회';
      }
    }

    function renderTable(type, title, items) {
      const amountClass = type === 'top' ? 'amount-up' : 'amount-down';
      const rows = (items || []).map((item, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td>
            <div class="name">${item.name}</div>
            <div class="code">${item.code}</div>
          </td>
          <td class="${amountClass}">${item.netBuyF}</td>
        </tr>
      `).join('');

      return `
        <div class="table-card ${type}">
          <div class="table-header">${title}</div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>종목</th>
                <th style="text-align:right">순매수금액</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="3" style="text-align:center;padding:20px;color:#64748b">데이터 없음</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }
  </script>
</body>
</html>
