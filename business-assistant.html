<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사업 구상 비서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #8b5cf6;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      transform: translateX(-4px);
    }
    .chat-container {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: white;
    }
    .message.ai {
      align-self: flex-start;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }
    .input-group {
      display: flex;
      gap: 12px;
    }
    .input-group input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 15px;
      outline: none;
    }
    .input-group input:focus {
      border-color: rgba(139, 92, 246, 0.7);
    }
    .input-group button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    .input-group button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #93c5fd;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💼 사업 구상 비서</h1>
      <a href="index.html" class="back-btn">← 돌아가기</a>
    </div>

    <div class="chat-container">
      <div class="chat-messages" id="messages">
        <div class="message ai">사업 아이디어에 대해 궁금한 점을 물어보세요. 함께 생각해볼게요!</div>
      </div>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="질문을 입력하세요..." />
        <button onclick="sendMessage()">전송</button>
      </div>
    </div>
  </div>

  <script>
    const OLLAMA_URL = 'http://localhost:11434/api/generate';
    const MODEL = 'gemma3:1b';

    function addMessage(text, isUser) {
      const messagesDiv = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user' : 'ai'}`;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const btn = document.querySelector('button');
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, true);
      input.value = '';
      btn.disabled = true;
      btn.textContent = '답변 중...';

      try {
        const response = await fetch(`/api/ai-chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, type: 'business' })
        });

        const data = await response.json();
        if (data.response) {
          addMessage(data.response, false);
        } else {
          addMessage('답변을 생성할 수 없습니다.', false);
        }
      } catch (e) {
        addMessage('서버 연결 오류가 발생했습니다.', false);
      } finally {
        btn.disabled = false;
        btn.textContent = '전송';
      }
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
