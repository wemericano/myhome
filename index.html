<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>My Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      text-align: center;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    p {
      opacity: 0.8;
      font-size: 16px;
    }
    .button-container {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: inherit;
      filter: brightness(1.2);
      transition: left 0.3s ease;
      z-index: -1;
    }
    .btn:hover::before {
      left: 0;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.5);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    }
    .btn-secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(139, 92, 246, 0.5);
    }
    .btn:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚀 Hello My World 🚀</h1>
    <p>- WeVeloper -</p>
    <div class="button-container">
      <a href="portfolio.html" class="btn btn-primary" style="text-decoration: none; display: inline-block;">포트폴리오</a>
    </div>
    <div class="button-container">
      <a href="stock_ai.html" class="btn btn-primary" style="text-decoration: none; display: inline-block;">AI Stock Predictor</a>
    </div>
  </div>
</body>
</html>
